<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的記帳 App - 簡約版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 50%, #43e97b 100%);
            --bg-color: #f0f8f7;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.05);
            --text-gray: #888;
            --expense-red: #ff5e5e;
            --income-green: #2ecc71;
        }

        body {
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #333;
            padding-bottom: 80px;
        }

        .header-summary {
            background: var(--primary-gradient);
            border-radius: 25px;
            padding: 35px 20px;
            text-align: center;
            color: white;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }
        .total-amt { font-size: 32px; font-weight: 800; }
        .period-text { font-size: 16px; opacity: 0.9; margin-bottom: 5px; font-weight: 600; }

        .card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }

        /* 日曆 */
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
        .btn-all { font-size: 12px; color: #4facfe; background: #eef9ff; padding: 4px 10px; border-radius: 8px; cursor: pointer; border: none; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 14px; padding: 10px; border-radius: 15px; }
        .cal-weekday { color: var(--text-gray); padding-bottom: 10px; pointer-events: none; }
        .cal-day { padding: 10px 0; position: relative; cursor: pointer; border-radius: 12px; transition: 0.2s; min-height: 45px; }
        .cal-day.active { border: 2px solid #4facfe; background: #eef9ff; font-weight: bold; }
        .cal-day .day-amt { font-size: 9px; color: var(--expense-red); position: absolute; bottom: 2px; width: 100%; left: 0; }

        /* 圖表 */
        .chart-container { position: relative; width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; }
        #no-data-msg { color: var(--text-gray); font-size: 14px; }
        .legend-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; }
        .dot { width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }

        /* 列表 (以分類作為標題) */
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f2f2f2; }
        .item-info .main-title { font-weight: 600; font-size: 17px; margin-bottom: 2px; }
        .item-info .sub-title { font-size: 12px; color: var(--text-gray); }
        .amt-val { font-weight: bold; font-size: 16px; text-align: right; }
        .btn-cancel { background: #fff0f0; color: #ff5e5e; border: none; padding: 2px 8px; border-radius: 5px; font-size: 11px; margin-top: 4px; cursor: pointer; }

        /* 輸入框 */
        input, select {
            width: 100%; background: #f7f9fb; border: 1px solid #eee;
            padding: 12px; margin: 8px 0; border-radius: 12px; font-size: 15px; box-sizing: border-box;
        }
        .type-toggle { display: flex; gap: 10px; margin-bottom: 10px; }
        .type-toggle button { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #eee; background: white; cursor: pointer; font-weight: 600; }
        .type-toggle button.active.exp { background: var(--expense-red); color: white; border-color: var(--expense-red); }
        .type-toggle button.active.inc { background: var(--income-green); color: white; border-color: var(--income-green); }
        
        .btn-save { background: #2ecc71; color: white; border: none; width: 100%; padding: 15px; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .btn-action { width: 100%; padding: 12px; border-radius: 15px; border: none; background: #f0f2f5; font-weight: 500; margin-bottom: 10px; cursor: pointer; }
        .btn-danger { color: #ff5e5e; background: #fff0f0; }

        #csv-import { display: none; }
    </style>
</head>
<body>

    <div class="header-summary">
        <div class="period-text" id="summary-period">4月全月總計</div>
        <div id="total-balance" class="total-amt">HKD $0.00</div>
    </div>

    <div class="card">
        <div class="calendar-nav">
            <span onclick="changeMonth(-1)" style="cursor:pointer">◀</span>
            <div>
                <span id="cal-month-year">2026/04</span>
                <button class="btn-all" onclick="resetFilter()">全部</button>
            </div>
            <span onclick="changeMonth(1)" style="cursor:pointer">▶</span>
        </div>
        <div class="cal-grid" id="calendar-body" onclick="resetFilter()"></div>
    </div>

    <div class="card">
        <h3>支出比例圖</h3>
        <div class="chart-container">
            <canvas id="expenseChart"></canvas>
            <div id="no-data-msg" style="display:none;">暫無支出數據</div>
        </div>
        <div class="legend-grid" id="chart-legend"></div>
    </div>

    <div class="card">
        <h3>📝 新增入帳</h3>
        <div class="type-toggle">
            <button id="btn-exp" class="active exp" onclick="setEntryType('expense')">支出</button>
            <button id="btn-inc" onclick="setEntryType('income')">收入</button>
        </div>
        <input type="date" id="in-date">
        <input type="number" id="in-amt" step="0.01" placeholder="金額 HKD $">
        <select id="in-cat"></select>
        <button class="btn-save" onclick="saveEntry()">儲存紀錄</button>
    </div>

    <div class="card">
        <h3 id="list-title">最近消費明細</h3>
        <div id="tx-list"></div>
    </div>

    <div class="card">
        <h3>⚙️ 資料管理</h3>
        <button class="btn-action" onclick="exportCSV()">📤 匯出 CSV</button>
        <button class="btn-action" onclick="document.getElementById('csv-import').click()">📥 匯入 CSV</button>
        <input type="file" id="csv-import" accept=".csv" onchange="importCSV(event)">
        <button class="btn-action btn-danger" onclick="clearAllData()">⚠️ 清空所有數據</button>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('my_expenses_v11')) || [];
        const categories = [
            { name: '食飯', icon: '🍱', color: '#36a2eb' },
            { name: '交通', icon: '🚌', color: '#4bc0c0' },
            { name: '買嘢', icon: '🛍️', color: '#ffce56' },
            { name: '娛樂', icon: '🎮', color: '#ff6384' },
            { name: '其他', icon: '❓', color: '#9966ff' }
        ];
        
        let currentMonth = new Date();
        let selectedDateStr = null;
        let entryType = 'expense';
        let chartObj = null;

        function init() {
            document.getElementById('in-date').valueAsDate = new Date();
            updateCatDropdown();
            renderAll();
        }

        function setEntryType(type) {
            entryType = type;
            document.getElementById('btn-exp').className = type === 'expense' ? 'active exp' : '';
            document.getElementById('btn-inc').className = type === 'income' ? 'active inc' : '';
        }

        function saveEntry() {
            const dateVal = document.getElementById('in-date').value;
            const amt = parseFloat(document.getElementById('in-amt').value);
            const catName = document.getElementById('in-cat').value;

            if (!dateVal || isNaN(amt)) return alert("請填寫金額！");

            const now = new Date();
            const timeStr = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;
            const fullDate = dateVal.replace(/-/g, '/') + " " + timeStr;

            entries.push({
                id: Date.now(),
                date: fullDate,
                category: catName, // 此處 catName 包含 Emoji
                amt: amt,
                type: entryType
            });

            syncAndRender();
            document.getElementById('in-amt').value = '';
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            syncAndRender();
        }

        function syncAndRender() {
            localStorage.setItem('my_expenses_v11', JSON.stringify(entries));
            renderAll();
        }

        function renderAll() {
            renderSummary();
            renderCalendar();
            renderChart();
            renderList();
        }

        function renderSummary() {
            const month = currentMonth.getMonth() + 1;
            document.getElementById('summary-period').innerText = `${month}月全月總計`;

            // 計算全月總計
            const bal = entries.reduce((acc, e) => {
                const eMonth = new Date(e.date.split(' ')[0].replace(/\//g, '-')).getMonth() + 1;
                if (eMonth === month) {
                    return e.type === 'income' ? acc + e.amt : acc - e.amt;
                }
                return acc;
            }, 0);

            const balanceEl = document.getElementById('total-balance');
            const prefix = bal > 0 ? "+" : (bal < 0 ? "-" : "");
            balanceEl.innerText = `HKD ${prefix}${Math.abs(bal).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            balanceEl.style.color = bal >= 0 ? "white" : "#fff"; // 保持白色 UI 統一
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-body');
            grid.innerHTML = '<div class="cal-weekday">日</div><div class="cal-weekday">一</div><div class="cal-weekday">二</div><div class="cal-weekday">三</div><div class="cal-weekday">四</div><div class="cal-weekday">五</div><div class="cal-weekday">六</div>';
            
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            document.getElementById('cal-month-year').innerText = `${year}/${String(month+1).padStart(2,'0')}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= daysInMonth; d++) {
                const datePart = `${year}/${month+1}/${d}`;
                const dayExp = entries.filter(e => e.date.split(' ')[0] === datePart && e.type === 'expense').reduce((s, e) => s + e.amt, 0);
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `cal-day ${selectedDateStr === datePart ? 'active' : ''}`;
                dayDiv.innerHTML = `<div>${d}</div>${dayExp > 0 ? `<div class="day-amt">-$${Math.round(dayExp)}</div>` : ''}`;
                dayDiv.onclick = (e) => { e.stopPropagation(); selectedDateStr = (selectedDateStr === datePart ? null : datePart); renderAll(); };
                grid.appendChild(dayDiv);
            }
        }

        function resetFilter() { selectedDateStr = null; renderAll(); }

        function renderList() {
            const listDiv = document.getElementById('tx-list');
            listDiv.innerHTML = '';
            
            let filtered = selectedDateStr 
                ? entries.filter(e => e.date.split(' ')[0] === selectedDateStr) 
                : [...entries].sort((a,b) => new Date(a.date.replace(/\//g,'-')) - new Date(b.date.replace(/\//g,'-'))).reverse().slice(0, 20);

            filtered.forEach(e => {
                listDiv.innerHTML += `
                    <div class="transaction-item">
                        <div class="item-info">
                            <div class="main-title">${e.category}</div>
                            <div class="sub-title">${e.date.split(' ')[0]}</div>
                        </div>
                        <div class="item-right">
                            <div class="amt-val" style="color: ${e.type === 'income' ? 'var(--income-green)' : 'var(--expense-red)'}">
                                ${e.type === 'income' ? '+' : '-'}HKD $${e.amt.toFixed(2)}
                            </div>
                            <button class="btn-cancel" onclick="deleteEntry(${e.id})">取消</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const month = currentMonth.getMonth() + 1;
            const monthExpenses = entries.filter(e => {
                const eMonth = new Date(e.date.split(' ')[0].replace(/\//g, '-')).getMonth() + 1;
                return eMonth === month && e.type === 'expense';
            });

            const dataMap = {};
            categories.forEach(c => dataMap[`${c.icon} ${c.name}`] = 0);
            monthExpenses.forEach(e => { if(dataMap[e.category] !== undefined) dataMap[e.category] += e.amt; });

            const vals = Object.values(dataMap);
            const hasData = vals.some(v => v > 0);

            document.getElementById('no-data-msg').style.display = hasData ? 'none' : 'block';
            if (chartObj) chartObj.destroy();
            if (!hasData) { document.getElementById('chart-legend').innerHTML = ''; return; }

            chartObj = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dataMap),
                    datasets: [{ data: vals, backgroundColor: categories.map(c => c.color), borderWidth: 0 }]
                },
                options: { cutout: '75%', plugins: { legend: { display: false } }, maintainAspectRatio: false }
            });

            document.getElementById('chart-legend').innerHTML = categories.map(c => `
                <div class="legend-item"><div class="dot" style="background:${c.color}"></div>${c.icon} ${c.name}</div>
            `).join('');
        }

        function exportCSV() {
            if (entries.length === 0) return alert("冇數據可以匯出");
            let csv = "\ufeff日期,項目,類別,金額\n";
            entries.forEach(e => {
                // 為了兼容之前的 4 欄 CSV，我們將分類名當作「項目」填寫
                csv += `${e.date},${e.category},${e.category},${e.amt}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `My_Expenses_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n').slice(1);
                const newEntries = [];
                rows.forEach(row => {
                    if (!row.trim()) return;
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length >= 4) {
                        newEntries.push({
                            id: Date.now() + Math.random(),
                            date: cols[0].trim(),
                            category: cols[2].trim(), // 讀取類別
                            amt: parseFloat(cols[3]) || 0,
                            type: 'expense'
                        });
                    }
                });
                if (confirm(`匯入 ${newEntries.length} 條紀錄？`)) { entries = newEntries; syncAndRender(); }
            };
            reader.readAsText(file);
        }

        function updateCatDropdown() {
            document.getElementById('in-cat').innerHTML = categories.map(c => `<option value="${c.icon} ${c.name}">${c.icon} ${c.name}</option>`).join('');
        }

        function changeMonth(step) { currentMonth.setMonth(currentMonth.getMonth() + step); resetFilter(); }

        function clearAllData() { if(confirm("確定清空所有數據？")) { localStorage.removeItem('my_expenses_v11'); entries = []; renderAll(); } }

        window.onload = init;
    </script>
</body>
</html>
