<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>資產管理 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #5AC8FA; --accent: #34C759; --loss: #FF3B30; --bg: #F0F9F9; --card-bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px 20px 100px 20px; color: #2c3e50; }
        
        /* 頂部資產總覽 */
        .header-card { 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            padding: 25px; border-radius: 25px; color: white; text-align: center; 
            box-shadow: 0 10px 20px rgba(52,199,89,0.2); margin-bottom: 20px; 
        }
        .total-label { font-size: 0.9rem; opacity: 0.9; }
        .total-amount { font-size: 2.2rem; font-weight: 800; margin: 5px 0; }
        .sub-stats { display: flex; justify-content: space-around; font-size: 0.8rem; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 10px; }

        .glass-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        h3 { font-size: 1rem; margin: 0 0 15px 0; color: #444; }

        /* 月曆樣式 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-day-head { font-size: 0.7rem; color: #999; padding-bottom: 5px; }
        .cal-cell { aspect-ratio: 1; border-radius: 10px; background: #f8fcfc; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; border: 1px solid #f0f5f5; }
        .cal-cell.today { border: 2px solid var(--primary); font-weight: bold; }
        .cal-amt { font-size: 0.55rem; margin-top: 2px; }
        .amt-red { color: var(--loss); }
        .amt-green { color: var(--accent); }

        /* 輸入介面 */
        .type-selector { display: flex; gap: 10px; margin-bottom: 12px; }
        .type-btn { flex: 1; padding: 10px; border-radius: 12px; border: 2px solid #eee; text-align: center; font-weight: bold; cursor: pointer; }
        .type-btn.active.exp { background: var(--loss); color: white; border-color: var(--loss); }
        .type-btn.active.inc { background: var(--accent); color: white; border-color: var(--accent); }

        input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: none; font-size: 1rem; box-sizing: border-box; }
        input, select { background: #f1f8f8; }
        .btn-main { background: var(--primary); color: white; font-weight: bold; }
        .btn-sec { background: #E5E5EA; color: #333; font-size: 0.8rem; margin-bottom: 5px; }
        
        .cat-tag { display: inline-block; background: #e8f4f4; padding: 5px 10px; border-radius: 8px; margin: 3px; font-size: 0.75rem; }
        .del { color: #ff3b30; margin-left: 5px; }
        
        .list-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f7f7; }
        .icon-circle { width: 40px; height: 40px; background: #e8f4f4; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 1.2rem; }
        .item-info { flex-grow: 1; }
        .item-note { font-weight: 600; font-size: 0.95rem; }
        .item-sub { font-size: 0.75rem; color: #99abb0; }
        .item-amt { font-weight: 700; font-size: 0.9rem; }
        
        .chart-wrap { height: 220px; width: 100%; }
        .fab { position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; color: white; font-size: 28px; border: none; box-shadow: 0 8px 20px rgba(90, 200, 250, 0.4); z-index: 100; }
    </style>
</head>
<body>

<div class="header-card">
    <div class="total-label">本期淨資產變動</div>
    <div class="total-amount">HKD $<span id="netDisplay">0</span></div>
    <div class="sub-stats">
        <div>收入: <span id="incDisplay">0</span></div>
        <div>支出: <span id="expDisplay">0</span></div>
    </div>
</div>

<div class="glass-card">
    <h3 id="calTitle">2026/04 收益日曆</h3>
    <div class="calendar-grid" id="calendarGrid">
        <div class="cal-day-head">日</div><div class="cal-day-head">一</div><div class="cal-day-head">二</div><div class="cal-day-head">三</div><div class="cal-day-head">四</div><div class="cal-day-head">五</div><div class="cal-day-head">六</div>
    </div>
</div>

<div class="glass-card">
    <h3>📊 支出分佈分析</h3>
    <div class="chart-wrap">
        <canvas id="expenseChart"></canvas>
    </div>
</div>

<div class="glass-card">
    <h3>📝 記帳</h3>
    <div class="type-selector">
        <div id="typeExp" class="type-btn active exp" onclick="setType('expense')">支出 🔴</div>
        <div id="typeInc" class="type-btn inc" onclick="setType('income')">收入 🟢</div>
    </div>
    <input type="text" id="note" placeholder="項目 (例如：人工、買飯)">
    <input type="number" id="amt" placeholder="金額" inputmode="decimal">
    <select id="catSelect"></select>
    <button class="btn-main" onclick="add()">儲存紀錄</button>
</div>

<div class="glass-card">
    <h3>⚙️ 管理</h3>
    <div style="font-size: 0.8rem; margin-bottom: 10px;">起始日：<input type="number" id="startDay" min="1" max="28" value="1" onchange="updateUI()" style="width:50px; display:inline; padding:5px;"></div>
    <div id="catList"></div>
    <div style="display:flex; gap:5px;"><input type="text" id="newCat" placeholder="加分類" style="margin:0;"><button onclick="addCat()" style="width:60px; margin:0; background:var(--accent); color:white;">+</button></div>
    <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
    <button class="btn-sec" onclick="exportCSV()">📤 匯出資料</button>
    <button class="btn-sec" onclick="document.getElementById('fileIn').click()">📥 匯入資料</button>
    <input type="file" id="fileIn" accept=".csv" style="display:none" onchange="importCSV(event)">
</div>

<div class="glass-card">
    <h3>🗓️ 最近紀錄</h3>
    <div id="recordList"></div>
</div>

<button class="fab" onclick="window.scrollTo({top: 600, behavior: 'smooth'})">+</button>

<script>
    let records = JSON.parse(localStorage.getItem('myExp_V3')) || [];
    let categories = JSON.parse(localStorage.getItem('myCats_V3')) || ['🍱 食飯', '🚌 交通', '🛍️ 買嘢', '🎮 娛樂', '💰 收入', '❓ 其他'];
    let currentType = 'expense';
    let myChart = null;

    function setType(t) {
        currentType = t;
        document.getElementById('typeExp').classList.toggle('active', t === 'expense');
        document.getElementById('typeInc').classList.toggle('active', t === 'income');
    }

    function updateUI() {
        const startDay = parseInt(document.getElementById('startDay').value) || 1;
        localStorage.setItem('startDay', startDay);
        
        // 分類管理
        const select = document.getElementById('catSelect');
        const catListDiv = document.getElementById('catList');
        select.innerHTML = ''; catListDiv.innerHTML = '';
        categories.forEach((c, i) => {
            select.innerHTML += `<option value="${c}">${c}</option>`;
            catListDiv.innerHTML += `<span class="cat-tag">${c}<span class="del" onclick="delCat(${i})">×</span></span>`;
        });

        const now = new Date();
        let cycleStart = new Date(now.getFullYear(), now.getMonth(), startDay);
        if (now.getDate() < startDay) cycleStart.setMonth(cycleStart.getMonth() - 1);
        let cycleEnd = new Date(cycleStart); cycleEnd.setMonth(cycleEnd.getMonth() + 1);

        const thisCycle = records.filter(r => { const d = new Date(r.date); return d >= cycleStart && d < cycleEnd; });

        let totalExp = 0, totalInc = 0;
        const expStats = {}; // 圓餅圖只計支出
        const list = document.getElementById('recordList');
        list.innerHTML = '';

        thisCycle.forEach(re => {
            const val = parseFloat(re.amount);
            if(re.type === 'income') {
                totalInc += val;
            } else {
                totalExp += val;
                expStats[re.category] = (expStats[re.category] || 0) + val;
            }
            list.innerHTML += `
                <div class="list-item">
                    <div class="icon-circle">${re.type==='income'?'🟢':'🔴'}</div>
                    <div class="item-info">
                        <div class="item-note">${re.note || re.category}</div>
                        <div class="item-sub">${re.category} | ${new Date(re.date).toLocaleDateString()}</div>
                    </div>
                    <div class="item-amt ${re.type==='income'?'amt-green':'amt-red'}">
                        ${re.type==='income'?'+':'-'}HKD $${val.toLocaleString()}
                    </div>
                </div>`;
        });

        document.getElementById('netDisplay').innerText = (totalInc - totalExp).toLocaleString();
        document.getElementById('incDisplay').innerText = totalInc.toLocaleString();
        document.getElementById('expDisplay').innerText = totalExp.toLocaleString();
        
        renderCalendar(now.getFullYear(), now.getMonth());
        renderChart(expStats);
        localStorage.setItem('myExp_V3', JSON.stringify(records));
        localStorage.setItem('myCats_V3', JSON.stringify(categories));
    }

    function renderCalendar(year, month) {
        document.getElementById('calTitle').innerText = `${year}/${month+1} 收益日曆`;
        const grid = document.getElementById('calendarGrid');
        while(grid.children.length > 7) grid.removeChild(grid.lastChild);
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=daysInMonth; d++) {
            const dayRecords = records.filter(r => {
                const rd = new Date(r.date);
                return rd.getFullYear()===year && rd.getMonth()===month && rd.getDate()===d;
            });
            const dayNet = dayRecords.reduce((s, r) => s + (r.type==='income'?1:-1)*parseFloat(r.amount), 0);
            const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
            
            grid.innerHTML += `
                <div class="cal-cell ${isToday?'today':''}">
                    <div>${d}</div>
                    <div class="cal-amt ${dayNet>=0?'amt-green':'amt-red'}">
                        ${dayNet!==0 ? (dayNet>0?'+':'')+Math.round(dayNet) : ''}
                    </div>
                </div>`;
        }
    }

    function renderChart(stats) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (myChart) myChart.destroy();
        if (Object.keys(stats).length === 0) return;
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(stats),
                datasets: [{ data: Object.values(stats), backgroundColor: ['#5AC8FA', '#34C759', '#FFCC00', '#FF3B30', '#AF52DE', '#8E8E93'], borderWidth: 0 }]
            },
            options: { maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
        });
    }

    function add() {
        const n = document.getElementById('note').value, a = document.getElementById('amt').value, c = document.getElementById('catSelect').value;
        if (!a) return alert('入金額！');
        records.unshift({ note: n, amount: a, category: c, type: currentType, date: new Date().toISOString() });
        document.getElementById('note').value = ''; document.getElementById('amt').value = '';
        updateUI();
    }

    function addCat() { const v = document.getElementById('newCat').value; if(v){categories.push(v); document.getElementById('newCat').value=''; updateUI();} }
    function delCat(i) { categories.splice(i, 1); updateUI(); }

    function exportCSV() {
        let csv = "\uFEFF日期,項目,類別,類型,金額\n";
        records.forEach(r => csv += `${new Date(r.date).toLocaleString()},${r.note},${r.category},${r.type},${r.amount}\n`);
        const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        link.download = "assets_report.csv"; link.click();
    }

    function importCSV(e) {
        const reader = new FileReader();
        reader.onload = function(f) {
            const lines = f.target.result.split('\n');
            for(let i=1; i<lines.length; i++) {
                const c = lines[i].split(',');
                if(c.length >= 5) records.push({ date: new Date(c[0]).toISOString(), note: c[1], category: c[2], type: c[3], amount: c[4] });
            }
            updateUI(); alert('匯入成功！');
        };
        reader.readAsText(e.target.files[0]);
    }

    document.getElementById('startDay').value = localStorage.getItem('startDay') || 1;
    updateUI();
</script>

</body>
</html>
