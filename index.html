<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>豪華記帳Pro (最終完整版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #5AC8FA; --accent: #34C759; --bg: #F0F9F9; --card-bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 20px 20px 100px 20px; color: #2c3e50; }
        
        .header-card { background: linear-gradient(135deg, var(--primary), var(--accent)); padding: 30px 20px; border-radius: 30px; color: white; text-align: center; box-shadow: 0 10px 25px rgba(52,199,89,0.2); margin-bottom: 25px; }
        .total-amount { font-size: 2.5rem; font-weight: 800; margin-top: 5px; }

        .glass-card { background: var(--card-bg); border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        h3 { font-size: 1rem; margin: 0 0 15px 0; color: #555; display: flex; justify-content: space-between; align-items: center; }

        /* 輸入框樣式修復 */
        input, select { background: #f1f8f8; border: 2px solid transparent; padding: 15px; border-radius: 18px; width: 100%; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; -webkit-appearance: none; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        /* 針對 iOS Date Input 的專門修復 */
        input[type="date"] {
            min-height: 50px;
            display: block;
            position: relative;
        }

        .btn { border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-main { background: var(--accent); color: white; margin-top: 5px; box-shadow: 0 4px 12px rgba(52,199,89,0.2); }
        .btn-export { background: #E5E5EA; color: #333; margin-top: 10px; font-size: 0.85rem; }

        .list-item { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid #f0f7f7; }
        .icon-circle { width: 45px; height: 45px; background: #e8f4f4; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 1.3rem; }
        .item-info { flex-grow: 1; }
        .item-info .item-note { font-weight: 600; font-size: 1rem; }
        .item-info .item-sub { font-size: 0.8rem; color: #99abb0; }
        .item-amt { font-weight: 700; color: #ff3b30; font-size: 1rem; white-space: nowrap; }

        /* 日曆格 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-head { font-size: 0.7rem; color: #999; padding-bottom: 5px; }
        .cal-cell { aspect-ratio: 1; border-radius: 10px; background: #f8fcfc; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.8rem; border: 1px solid #f0f5f5; }
        .cal-cell.today { border: 2px solid var(--primary); font-weight: bold; background: #fff; }
        .cal-amt { font-size: 0.5rem; color: #ff3b30; margin-top: 2px; height: 12px; overflow: hidden; }

        .cat-tag-manage { display: inline-block; background: #e8f4f4; padding: 5px 10px; border-radius: 8px; margin: 3px; font-size: 0.8rem; }
        .del-cat { color: red; margin-left: 5px; font-weight: bold; cursor: pointer; }
        .chart-wrap { height: 220px; position: relative; }
    </style>
</head>
<body>

<div class="header-card">
    <span id="cycleLabel">本期支出</span>
    <div class="total-amount">HKD $<span id="totalDisplay">0</span></div>
</div>

<div class="glass-card">
    <h3 id="calMonthTitle">支出日曆</h3>
    <div class="calendar-grid" id="calendarGrid">
        <div class="cal-day-head">日</div><div class="cal-day-head">一</div><div class="cal-day-head">二</div><div class="cal-day-head">三</div><div class="cal-day-head">四</div><div class="cal-day-head">五</div><div class="cal-day-head">六</div>
    </div>
</div>

<div class="glass-card">
    <h3>📊 支出比例圖</h3>
    <div class="chart-wrap">
        <canvas id="expenseChart"></canvas>
    </div>
</div>

<div class="glass-card">
    <h3>📝 新增入數</h3>
    <label style="font-size:0.8rem; color:#999; margin-left:5px;">選擇日期 (補數用)</label>
    <input type="date" id="dateInput">
    <input type="text" id="note" placeholder="項目項目 (例如：午餐 / 買波鞋)">
    <input type="number" id="amt" placeholder="金額 HKD $" inputmode="decimal">
    <select id="catSelect"></select>
    <button class="btn btn-main" onclick="add()">儲存紀錄</button>
</div>

<div class="glass-card">
    <h3>⚙️ 管理與設定</h3>
    <div style="font-size:0.85rem; margin-bottom:10px;">
        每月起始日：<input type="number" id="startDay" min="1" max="28" value="1" onchange="updateUI()" style="width:50px; padding:5px; margin:0; display:inline;"> 號
    </div>
    <div id="catList" style="margin-bottom:10px;"></div>
    <div style="display: flex; gap: 5px;">
        <input type="text" id="newCat" placeholder="新分類名" style="margin-bottom:0;">
        <button class="btn-main" onclick="addCat()" style="width:70px; margin-bottom:0; padding:10px;">加</button>
    </div>
    <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
    <button class="btn btn-export" onclick="exportCSV()">📤 匯出資料 (Excel)</button>
    <button class="btn btn-export" onclick="document.getElementById('importFile').click()">📥 匯入舊數據 (CSV)</button>
    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
    <button class="btn btn-export" onclick="clearAll()" style="color:red; margin-top:10px; background:#fff0f0;">⚠️ 清空所有數據</button>
</div>

<div class="glass-card">
    <h3>🗓️ 消費明細</h3>
    <div id="recordList"></div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('myExp_V5_Final')) || [];
    let categories = JSON.parse(localStorage.getItem('myCats_V5')) || ['🍱 食飯', '🚌 交通', '🛍️ 買嘢', '🎮 娛樂', '❓ 其他'];
    let myChart = null;

    // 預設今日日期
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = todayStr;

    function updateUI() {
        const startDay = parseInt(document.getElementById('startDay').value) || 1;
        localStorage.setItem('startDay', startDay);
        
        const select = document.getElementById('catSelect');
        const catListDiv = document.getElementById('catList');
        select.innerHTML = '';
        catListDiv.innerHTML = '<strong>分類：</strong>';
        categories.forEach((c, i) => {
            select.innerHTML += `<option value="${c}">${c}</option>`;
            catListDiv.innerHTML += `<span class="cat-tag-manage">${c} <span class="del-cat" onclick="delCat(${i})">×</span></span>`;
        });

        const now = new Date();
        let cycleStart = new Date(now.getFullYear(), now.getMonth(), startDay);
        if (now.getDate() < startDay) cycleStart.setMonth(cycleStart.getMonth() - 1);
        let cycleEnd = new Date(cycleStart); cycleEnd.setMonth(cycleEnd.getMonth() + 1);

        document.getElementById('cycleLabel').innerText = `${cycleStart.getMonth()+1}/${cycleStart.getDate()} - ${cycleEnd.getMonth()+1}/${cycleEnd.getDate()} 支出`;

        const thisCycle = records.filter(r => {
            const d = new Date(r.date);
            return d >= cycleStart && d < cycleEnd;
        }).sort((a,b) => new Date(b.date) - new Date(a.date));

        let total = 0;
        const stats = {}; categories.forEach(c => stats[c] = 0);
        const list = document.getElementById('recordList');
        list.innerHTML = '';

        thisCycle.forEach(re => {
            total += parseFloat(re.amount);
            if(stats[re.category] !== undefined) stats[re.category] += parseFloat(re.amount);
            list.innerHTML += `
                <div class="list-item">
                    <div class="icon-circle">💰</div>
                    <div class="item-info">
                        <div class="item-note">${re.note || re.category}</div>
                        <div class="item-sub">${re.category} | ${new Date(re.date).toLocaleDateString()}</div>
                    </div>
                    <div class="item-amt">-HKD $${parseFloat(re.amount).toLocaleString()}</div>
                </div>`;
        });

        document.getElementById('totalDisplay').innerText = total.toLocaleString();
        renderCalendar(now.getFullYear(), now.getMonth());
        drawChart(stats);
        
        localStorage.setItem('myExp_V5_Final', JSON.stringify(records));
        localStorage.setItem('myCats_V5', JSON.stringify(categories));
    }

    function renderCalendar(year, month) {
        document.getElementById('calMonthTitle').innerText = `${year}年${month+1}月 支出日曆`;
        const grid = document.getElementById('calendarGrid');
        while(grid.children.length > 7) grid.removeChild(grid.lastChild);
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=daysInMonth; d++) {
            const dayTotal = records.reduce((sum, r) => {
                const rDate = new Date(r.date);
                return (rDate.getFullYear()===year && rDate.getMonth()===month && rDate.getDate()===d) ? sum + parseFloat(r.amount) : sum;
            }, 0);
            const isToday = (new Date().getDate()===d && new Date().getMonth()===month);
            grid.innerHTML += `<div class="cal-cell ${isToday?'today':''}"><div>${d}</div><div class="cal-amt">${dayTotal > 0 ? '-$'+Math.round(dayTotal) : ''}</div></div>`;
        }
    }

    function drawChart(stats) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#5AC8FA', '#34C759', '#FFCC00', '#FF3B30', '#AF52DE', '#FF9500'], borderWidth: 0 }] },
            options: { maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
        });
    }

    function add() {
        const dVal = document.getElementById('dateInput').value;
        const n = document.getElementById('note').value;
        const a = document.getElementById('amt').value;
        const c = document.getElementById('catSelect').value;
        if (!a) return alert('入埋錢先！');
        let finalDate = new Date(dVal);
        const now = new Date();
        finalDate.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
        records.unshift({ note: n, amount: a, category: c, date: finalDate.toISOString() });
        document.getElementById('note').value = ''; document.getElementById('amt').value = '';
        updateUI();
    }

    function addCat() {
        const val = document.getElementById('newCat').value;
        if(val && !categories.includes(val)) { categories.push(val); document.getElementById('newCat').value = ''; updateUI(); }
    }
    function delCat(i) { if(confirm('刪除分類？')) { categories.splice(i, 1); updateUI(); } }

    function exportCSV() {
        let csv = "\uFEFF日期,項目,類別,金額\n";
        records.forEach(r => csv += `${new Date(r.date).toLocaleString()},${r.note},${r.category},${r.amount}\n`);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        link.download = "HKD_Expenses.csv"; link.click();
    }

    function importCSV(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(f) {
            try {
                const lines = f.target.result.split('\n');
                for(let i=1; i<lines.length; i++) {
                    const cols = lines[i].split(',');
                    if(cols.length >= 4) records.push({ date: new Date(cols[0]).toISOString(), note: cols[1], category: cols[2], amount: cols[3].replace(/[^\d.]/g, '') });
                }
                updateUI(); alert('匯入成功！');
            } catch(err) { alert('匯入失敗！'); }
        };
        reader.readAsText(file);
    }

    function clearAll() { if(confirm('⚠️ 確定刪除所有數據？')) { records = []; updateUI(); } }

    const savedDay = localStorage.getItem('startDay') || 1;
    document.getElementById('startDay').value = savedDay;
    updateUI();
</script>

</body>
</html>
