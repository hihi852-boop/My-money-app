<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>豪華記帳日曆</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #5AC8FA; --accent: #34C759; --bg: #F0F9F9; --card-bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px 20px 100px 20px; color: #2c3e50; }
        .header-card { background: linear-gradient(135deg, var(--primary), var(--accent)); padding: 25px; border-radius: 25px; color: white; text-align: center; box-shadow: 0 10px 20px rgba(52,199,89,0.2); margin-bottom: 20px; }
        .total-amount { font-size: 2.2rem; font-weight: 800; }
        .glass-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        h3 { font-size: 1rem; margin: 0 0 15px 0; color: #444; display: flex; justify-content: space-between; }
        
        /* 月曆樣式 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-head { font-size: 0.7rem; color: #999; padding-bottom: 5px; }
        .cal-cell { aspect-ratio: 1; border-radius: 10px; background: #f8fcfc; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.8rem; border: 1px solid #f0f5f5; }
        .cal-cell.today { border: 2px solid var(--primary); font-weight: bold; }
        .cal-amt { font-size: 0.5rem; color: #ff3b30; margin-top: 2px; }

        input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: none; font-size: 1rem; box-sizing: border-box; }
        input, select { background: #f1f8f8; }
        .btn-main { background: var(--accent); color: white; font-weight: bold; }
        .btn-sec { background: #E5E5EA; color: #333; font-size: 0.8rem; }
        
        .cat-tag-manage { display: inline-block; background: #e8f4f4; padding: 5px 10px; border-radius: 8px; margin: 3px; font-size: 0.8rem; }
        .del-cat { color: red; margin-left: 5px; font-weight: bold; }
        
        .list-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f7f7; }
        .icon-circle { width: 40px; height: 40px; background: #e8f4f4; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 1.2rem; }
        .item-info { flex-grow: 1; }
        .item-amt { font-weight: 700; color: #ff3b30; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="header-card">
    <span id="cycleLabel">本期支出</span>
    <div class="total-amount">HKD $<span id="totalDisplay">0</span></div>
</div>

<div class="glass-card">
    <h3 id="calMonthTitle">2026/04 支出日曆</h3>
    <div class="calendar-grid" id="calendarGrid">
        <div class="cal-day-head">日</div><div class="cal-day-head">一</div><div class="cal-day-head">二</div><div class="cal-day-head">三</div><div class="cal-day-head">四</div><div class="cal-day-head">五</div><div class="cal-day-head">六</div>
        </div>
</div>

<div class="glass-card">
    <h3>⚙️ 設定與管理</h3>
    <div style="font-size: 0.8rem; margin-bottom: 10px;">
        起始日：<input type="number" id="startDay" min="1" max="28" value="1" onchange="updateUI()" style="width:50px; display:inline; padding:5px;"> 號
    </div>
    <div id="catList"></div>
    <div style="display: flex; gap: 5px;">
        <input type="text" id="newCat" placeholder="新分類名" style="margin-bottom:0;">
        <button class="btn-main" onclick="addCat()" style="width:80px; margin-bottom:0;">加</button>
    </div>
    <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
    <button class="btn-sec" onclick="exportCSV()">📤 匯出 Excel (CSV)</button>
    <button class="btn-sec" onclick="document.getElementById('importFile').click()">📥 匯入 Excel (CSV)</button>
    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
</div>

<div class="glass-card">
    <h3>📝 快速入數</h3>
    <input type="text" id="note" placeholder="項目 (例如：午餐)">
    <input type="number" id="amt" placeholder="金額" inputmode="decimal">
    <select id="catSelect"></select>
    <button class="btn-main" onclick="add()">儲存紀錄</button>
</div>

<div class="glass-card">
    <h3>🗓️ 最近消費</h3>
    <div id="recordList"></div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('myExp_Final_V2')) || [];
    let categories = JSON.parse(localStorage.getItem('myCats')) || ['🍱 食飯', '🚌 交通', '🛍️ 買嘢', '🎮 娛樂', '❓ 其他'];
    
    function updateUI() {
        const startDay = parseInt(document.getElementById('startDay').value) || 1;
        localStorage.setItem('startDay', startDay);
        
        // 處理分類選單
        const select = document.getElementById('catSelect');
        const catListDiv = document.getElementById('catList');
        select.innerHTML = '';
        catListDiv.innerHTML = '分類：';
        categories.forEach((c, i) => {
            select.innerHTML += `<option value="${c}">${c}</option>`;
            catListDiv.innerHTML += `<span class="cat-tag-manage">${c} <span class="del-cat" onclick="delCat(${i})">×</span></span>`;
        });

        // 計算支出與週期
        const now = new Date();
        let cycleStart = new Date(now.getFullYear(), now.getMonth(), startDay);
        if (now.getDate() < startDay) cycleStart.setMonth(cycleStart.getMonth() - 1);
        let cycleEnd = new Date(cycleStart); cycleEnd.setMonth(cycleEnd.getMonth() + 1);

        document.getElementById('cycleLabel').innerText = `${cycleStart.getMonth()+1}/${cycleStart.getDate()} - ${cycleEnd.getMonth()+1}/${cycleEnd.getDate()} 支出`;

        const thisCycle = records.filter(r => {
            const d = new Date(r.date);
            return d >= cycleStart && d < cycleEnd;
        });

        let total = 0;
        const list = document.getElementById('recordList');
        list.innerHTML = '';
        thisCycle.forEach(re => {
            total += parseFloat(re.amount);
            list.innerHTML += `<div class="list-item"><div class="icon-circle">💰</div><div class="item-info"><div>${re.note || re.category}</div><span>${re.category} | ${new Date(re.date).toLocaleTimeString()}</span></div><div class="item-amt">-HKD $${parseFloat(re.amount).toLocaleString()}</div></div>`;
        });

        document.getElementById('totalDisplay').innerText = total.toLocaleString();
        renderCalendar(now.getFullYear(), now.getMonth());
        localStorage.setItem('myExp_Final_V2', JSON.stringify(records));
        localStorage.setItem('myCats', JSON.stringify(categories));
    }

    function renderCalendar(year, month) {
        document.getElementById('calMonthTitle').innerText = `${year}/${String(month+1).padStart(2,'0')} 支出日曆`;
        const grid = document.getElementById('calendarGrid');
        // 清除舊格子 (保留標題)
        while(grid.children.length > 7) grid.removeChild(grid.lastChild);
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        // 填充空白
        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const dayStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayTotal = records.reduce((sum, r) => {
                const rDate = new Date(r.date);
                return (rDate.getFullYear()===year && rDate.getMonth()===month && rDate.getDate()===d) ? sum + parseFloat(r.amount) : sum;
            }, 0);

            const isToday = (today.getFullYear()===year && today.getMonth()===month && today.getDate()===d);
            grid.innerHTML += `
                <div class="cal-cell ${isToday?'today':''}">
                    <div>${d}</div>
                    <div class="cal-amt">${dayTotal > 0 ? '-$'+Math.round(dayTotal) : ''}</div>
                </div>`;
        }
    }

    function add() {
        const n = document.getElementById('note').value;
        const a = document.getElementById('amt').value;
        const c = document.getElementById('catSelect').value;
        if (!a) return alert('入返錢先！');
        records.unshift({ note: n, amount: a, category: c, date: new Date().toISOString() });
        document.getElementById('note').value = ''; document.getElementById('amt').value = '';
        updateUI();
    }

    function addCat() {
        const val = document.getElementById('newCat').value;
        if(val) { categories.push(val); document.getElementById('newCat').value = ''; updateUI(); }
    }
    function delCat(i) { categories.splice(i, 1); updateUI(); }

    function exportCSV() {
        let csv = "\uFEFF日期,項目,類別,金額\n";
        records.forEach(r => csv += `${new Date(r.date).toLocaleString()},${r.note},${r.category},${r.amount}\n`);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        link.download = "my_expenses.csv"; link.click();
    }

    function importCSV(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(f) {
            const lines = f.target.result.split('\n');
            for(let i=1; i<lines.length; i++) {
                const cols = lines[i].split(',');
                if(cols.length >= 4) {
                    records.push({ date: new Date(cols[0]).toISOString(), note: cols[1], category: cols[2], amount: cols[3] });
                }
            }
            updateUI();
            alert('匯入成功！');
        };
        reader.readAsText(file);
    }

    const savedDay = localStorage.getItem('startDay') || 1;
    document.getElementById('startDay').value = savedDay;
    updateUI();
</script>

</body>
</html>
